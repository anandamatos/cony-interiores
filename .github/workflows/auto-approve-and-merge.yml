name: auto-approve-and-merge

on:
  pull_request_review:
    types: [submitted]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  approve-and-merge:
    runs-on: ubuntu-latest
    if: github.event.review.state == 'approved' && github.event.review.user.login == 'anandamatos'

    steps:
      # ⭐ PASSO OBRIGATÓRIO: Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR only touches docs/
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const nonDocs = files.filter(f => !f.filename.startsWith('docs/'));
            core.setOutput('is_docs_only', nonDocs.length === 0 ? 'true' : 'false');

      - name: Merge PR if docs-only
        if: steps.check.outputs.is_docs_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "📄 PR #$PR_NUMBER toca apenas docs/ — fazendo merge automático..."
          gh pr merge $PR_NUMBER --squash --delete-branch
          echo "✅ PR #$PR_NUMBER mergeada com sucesso!"

      - name: Skip merge — PR touches code
        if: steps.check.outputs.is_docs_only == 'false'
        run: echo "PR toca código — merge manual necessário."